<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal do Cliente — WM Engenharia</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--mar:#0a2557;--azul:#1565d8;--azul2:#3b82f6;--tx:#0f1f3d;--sub:#6b7a90;--borda:#e6ecf4;--fundo:#f3f6fb;--verde:#16a34a;--ambar:#b45309;--verm:#be123c;
  --sombra:0 1px 2px rgba(15,31,61,.04),0 6px 20px rgba(15,31,61,.05)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--fundo);color:var(--tx);min-height:100vh;font-size:15px;line-height:1.5}
a{color:var(--azul)}
.topo{background:radial-gradient(900px 400px at 90% 120%,#1565d8 0%,transparent 60%),linear-gradient(160deg,#0c2b62 0%,#0a2252 55%,#081c45 100%);color:#fff;padding:0 16px}
.topo-in{max-width:980px;margin:0 auto;padding:18px 0 26px}
.topo-bar{display:flex;align-items:center;gap:12px}
.topo-bar img{height:40px;display:block}
.topo-bar .rot{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:1.4px;color:#a9c8f5;text-transform:uppercase}
.hero{margin-top:22px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.hero h1{font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.4px;line-height:1.15}
.hero .cod{font-size:13px;color:#a9c8f5;font-weight:700;letter-spacing:.6px;margin-bottom:4px}
.hero .tipo{font-size:14px;color:#d6e4fb;margin-top:4px}
.selo{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.selo i{width:9px;height:9px;border-radius:50%;display:inline-block}
nav.sec{position:sticky;top:0;z-index:50;background:rgba(243,246,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--borda)}
nav.sec .in{max-width:980px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav.sec a{white-space:nowrap;text-decoration:none;color:var(--sub);font-weight:600;font-size:13.5px;padding:13px 12px;border-bottom:2px solid transparent}
nav.sec a.on{color:var(--azul);border-bottom-color:var(--azul)}
.main{max-width:980px;margin:0 auto;padding:22px 16px 40px}
.card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:20px;box-shadow:var(--sombra);margin-bottom:18px}
.titulo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.titulo .ic{width:34px;height:34px;border-radius:10px;background:#e9f1fd;color:var(--azul);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.titulo h2{font-size:16px;font-weight:700;color:var(--mar)}
.titulo .lado{margin-left:auto}
.sub{color:var(--sub);font-size:13px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.num{background:linear-gradient(160deg,#1565d80d 0%,#fff 70%);border:1px solid #1565d82e;border-radius:16px;padding:14px 16px;box-shadow:var(--sombra)}
.num .r{font-size:12.5px;font-weight:600;color:var(--tx)}
.num .v{font-size:22px;font-weight:800;color:var(--azul);margin-top:6px;line-height:1.1}
.num .l{font-size:12px;color:var(--sub);margin-top:4px}
.recado{display:flex;gap:10px;background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:18px}
.barra{height:12px;background:#e8eef5;border-radius:8px;overflow:hidden}
.barra i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#1565d8,#3b82f6);transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.lista{display:grid;gap:8px}
.disc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--borda);border-radius:12px}
.disc b{font-size:14px;color:var(--mar)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#166534}.t-and{background:#e9f1fd;color:var(--azul)}.t-pau{background:#fef3c7;color:#92400e}.t-pend{background:#fff1f2;color:var(--verm)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:9px 15px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit;border:1px solid var(--borda);background:#fff;color:var(--mar);white-space:nowrap}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.verde{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.peq{padding:6px 11px;font-size:13px}
.form{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px;border:1px solid var(--borda);border-radius:12px}
.form .t{flex:1;min-width:200px}
.form .t b{display:block;color:var(--mar);font-size:14.5px}
.pacote{border:1px solid var(--borda);border-radius:14px;overflow:hidden;margin-bottom:12px}
.pacote-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;background:#f8fbff;border-bottom:1px solid var(--borda)}
.pacote-cab .t{flex:1;min-width:200px}
.pacote-cab b{font-size:15px;color:var(--mar)}
.pacote.final .pacote-cab{background:#f0fdf4}
.nota{padding:10px 16px;font-size:13.5px;color:#334866;border-bottom:1px solid var(--borda);background:#fff}
.grupo{padding:8px 16px 0;font-size:11.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.arq{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid #f0f3f8}
.arq:first-child{border-top:none}
.arq .ext{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex:none;letter-spacing:.3px}
.arq .n{flex:1;min-width:0}
.arq .n b{display:block;font-size:14px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arq .n span{font-size:12px;color:var(--sub)}
.mod{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--borda);border-radius:12px;text-decoration:none;color:inherit}
.mod:hover,.arq:hover{background:#f8fbff}
.mod .ic{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#0a2557,#1565d8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.tl{display:flex;flex-direction:column}
.tl-i{display:flex;gap:14px;padding-bottom:16px}
.tl-e{display:flex;flex-direction:column;align-items:center;width:36px;flex:none}
.tl-ic{width:36px;height:36px;border-radius:50%;background:#e9f1fd;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid #dbe8fb}
.tl-l{width:2px;background:var(--borda);flex:1;margin-top:4px}
.tl-i:last-child .tl-l{display:none}
.tl-c{flex:1;padding-top:6px}
.tl-c b{font-size:14px;color:var(--tx)}
.tl-c p{font-size:13px;color:var(--sub);margin-top:2px}
.tl-c small{font-size:11.5px;color:#8a97ab}
.vazio{font-size:13.5px;color:var(--sub);background:var(--fundo);border-radius:10px;padding:14px}
.carreg{text-align:center;padding:90px 20px;color:var(--sub)}
.spin{width:42px;height:42px;border:3px solid #dbe4f0;border-top-color:var(--azul);border-radius:50%;animation:g .8s linear infinite;margin:0 auto 14px}
@keyframes g{to{transform:rotate(360deg)}}
.rod{text-align:center;color:var(--sub);font-size:12px;padding:10px 16px 30px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.selo{margin-left:0}}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div class="topo-bar"><img src="/Logo_Branco.png" alt="WM Engenharia Integrada"><span class="rot">Portal do Cliente</span></div>
    <div class="hero" id="hero"></div>
  </div>
</header>
<nav class="sec" id="nav" hidden><div class="in" id="navIn"></div></nav>
<main class="main" id="app"><div class="carreg"><div class="spin"></div>Carregando o seu projeto…</div></main>
<div class="rod">WM Engenharia Integrada · <a href="mailto:wmengenhariaintegrada@gmail.com">wmengenhariaintegrada@gmail.com</a> · (33) 99931-7042</div>

<script>
var TIPOS={PE:"Projeto Estrutural",PR:"Projeto de Reforço",LT:"Laudo Técnico",CB:"Compatibilização de projetos",EL:"Projeto Elétrico",PH:"Projeto Hidrossanitário",PA:"Projeto Arquitetônico",PF:"Projeto de Fundação",CT:"Consultoria",RE:"Revisão",PP:"Projeto de Piscina",PI:"Projeto de Interiores"};
var STATUS={"Em andamento":["Em andamento","#3b82f6"],"Novo/Definir":["Em preparação","#a9c8f5"],"PAUSADO":["Pausado","#f59e0b"],"PAUSADO PARCIAL":["Em andamento (parte pausada)","#f59e0b"],"ATRASADO":["Em andamento","#3b82f6"],"CONCLUÍDO":["Concluído","#22c55e"],"CONCLUIDO":["Concluído","#22c55e"],"CANCELADO":["Cancelado","#9ca3af"]};
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function data(d){if(!d)return"—";var p=String(d).slice(0,10).split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function diasAte(d){if(!d)return null;return Math.ceil((new Date(d+"T12:00:00")-new Date())/86400000)}
function quando(iso){if(!iso)return"";var n=Math.floor((new Date()-new Date(iso))/86400000);return n<=0?"Hoje":n===1?"Ontem":n<7?n+" dias atrás":data(iso)}
function tam(b){if(!b)return"";return b>=1048576?(b/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB":Math.max(1,Math.round(b/1024))+" KB"}
var EXT={pdf:["PDF","#fee2e2","#b91c1c"],dwg:["DWG","#e0f2fe","#0369a1"],dxf:["DXF","#e0f2fe","#0369a1"],ifc:["IFC","#ede9fe","#6d28d9"],rvt:["RVT","#dbeafe","#1d4ed8"],xlsx:["XLS","#dcfce7","#15803d"],xls:["XLS","#dcfce7","#15803d"],docx:["DOC","#dbeafe","#1d4ed8"],doc:["DOC","#dbeafe","#1d4ed8"],zip:["ZIP","#fef3c7","#92400e"],rar:["RAR","#fef3c7","#92400e"],jpg:["JPG","#fce7f3","#be185d"],jpeg:["JPG","#fce7f3","#be185d"],png:["PNG","#fce7f3","#be185d"],skp:["SKP","#ffedd5","#c2410c"]};
function extDe(n){var e=(String(n).split(".").pop()||"").toLowerCase();return EXT[e]||[e.slice(0,4).toUpperCase()||"ARQ","#eef1f6","#475569"]}
function sec(id,ic,titulo,corpo,lado){return '<section class="card" id="'+id+'"><div class="titulo"><span class="ic">'+ic+'</span><h2>'+titulo+'</h2>'+(lado?'<div class="lado">'+lado+'</div>':'')+'</div>'+corpo+'</section>'}

function erro(msg){
  document.getElementById("hero").innerHTML='';
  document.getElementById("app").innerHTML='<div class="card" style="text-align:center;padding:50px 20px"><div style="font-size:44px;margin-bottom:10px">🔒</div><h2 style="color:#0a2557;font-size:20px;margin-bottom:6px">Link não disponível</h2><p class="sub">'+esc(msg||"Este link não existe ou foi desativado.")+'</p><p class="sub" style="margin-top:14px">Dúvidas? Fale com a equipe WM pelo e-mail <a href="mailto:wmengenhariaintegrada@gmail.com">wmengenhariaintegrada@gmail.com</a>.</p></div>';
}

function render(d){
  var st=STATUS[d.status]||STATUS["Em andamento"];
  var prog=Math.min(100,Math.max(0,d.progresso||0));
  var dias=diasAte(d.dataEntregaPrevista);
  var concl=st[0]==="Concluído";
  document.title=(d.cliente||"Projeto")+" — Portal do Cliente WM";
  document.getElementById("hero").innerHTML='<div><div class="cod">'+esc(d.codigo)+'</div><h1>'+esc(d.cliente)+'</h1><div class="tipo">'+esc(TIPOS[d.tipo]||d.tipo||"")+'</div></div><span class="selo"><i style="background:'+st[1]+'"></i>'+esc(st[0])+'</span>';

  var secoes=[], h="";
  // ── Visão geral
  var prazoTxt=d.dataEntregaReal?("Entregue em "+data(d.dataEntregaReal)):d.dataEntregaPrevista?data(d.dataEntregaPrevista):"A definir";
  var prazoLeg=d.dataEntregaReal?"":dias===null?"":dias<0?"aguarde o contato da equipe":dias===0?"é hoje":dias+" dia(s) restantes";
  var discs=d.disciplinas||[], nEnt=discs.filter(function(x){return x.situacao==="entregue"}).length;
  var forms=d.formularios||[], ent=d.entregas||[], nArq=ent.reduce(function(a,p){return a+(p.arquivos||[]).length},0);
  h+='<div class="nums" id="geral">';
  h+='<div class="num"><div class="r">Andamento</div><div class="v">'+prog+'%</div><div class="barra" style="margin-top:8px"><i id="barra"></i></div></div>';
  h+='<div class="num"><div class="r">'+(d.dataEntregaReal?"Entrega":"Entrega prevista")+'</div><div class="v" style="font-size:19px">'+prazoTxt+'</div><div class="l">'+prazoLeg+'</div></div>';
  if(discs.length)h+='<div class="num"><div class="r">Disciplinas entregues</div><div class="v">'+nEnt+' de '+discs.length+'</div></div>';
  h+='<div class="num"><div class="r">Arquivos para baixar</div><div class="v">'+nArq+'</div><div class="l">'+(ent.length?ent.length+" entrega(s) publicada(s)":"nenhuma entrega ainda")+'</div></div>';
  h+='</div>';
  if(d.obs)h+='<div class="recado"><span>💬</span><span><b>Recado da equipe:</b> '+esc(d.obs)+'</span></div>';
  secoes.push(["geral","Visão geral"]);

  // ── Pendências do cliente (formulário)
  var pend=forms.filter(function(f){return f.situacao!=="enviado"});
  if(forms.length){
    var c='<p class="sub" style="margin:-6px 0 12px">As informações da sua obra que usamos para desenvolver o projeto. Você pode salvar e continuar depois.</p><div class="lista">';
    forms.forEach(function(f){
      var tg=f.situacao==="enviado"?'<span class="tag t-ok">✓ Enviado'+(f.enviadoEm?' em '+data(f.enviadoEm):'')+'</span>':f.situacao==="rascunho"?'<span class="tag t-pau">Em preenchimento</span>':'<span class="tag t-pend">Aguardando você</span>';
      c+='<div class="form"><div class="t"><b>Formulário de cadastro'+(f.obra?' · '+esc(f.obra):'')+'</b><span class="sub">'+(f.situacao==="enviado"?"Recebemos as suas respostas. Se precisar, você ainda pode revisar.":"Responda as perguntas sobre a obra, os ambientes e as suas preferências.")+'</span></div>'+tg+'<a class="btn '+(f.situacao==="enviado"?"":"pri")+'" href="'+esc(f.link)+'" target="_blank" rel="noopener">'+(f.situacao==="enviado"?"Ver respostas":f.situacao==="rascunho"?"Continuar":"Preencher agora")+'</a></div>';
    });
    c+='</div>';
    h+=sec("formulario","📝",pend.length?"Formulário · falta a sua parte":"Formulário de cadastro",c);
    secoes.push(["formulario","Formulário"]);
  }

  // ── Entregas
  var ce='';
  if(!ent.length){ce='<div class="vazio">'+(concl&&d.driveEntregaveis?'Os arquivos do projeto estão na pasta: <a href="'+esc(d.driveEntregaveis)+'" target="_blank" rel="noopener">abrir pasta de entregáveis</a>.':'Quando houver arquivos para você (entregas parciais e a entrega final), eles aparecem aqui para visualizar e baixar.')+'</div>'}
  ent.forEach(function(p){
    var grupos={},ordem=[];
    (p.arquivos||[]).forEach(function(a){var g=a.pasta||"";if(!grupos[g]){grupos[g]=[];ordem.push(g)}grupos[g].push(a)});
    var total=(p.arquivos||[]).reduce(function(s,a){return s+(a.tamanho||0)},0);
    ce+='<div class="pacote'+(p.tipo==="final"?" final":"")+'"><div class="pacote-cab"><span class="tag '+(p.tipo==="final"?"t-ok":"t-and")+'">'+(p.tipo==="final"?"ENTREGA FINAL":"ENTREGA PARCIAL")+'</span><div class="t"><b>'+esc(p.titulo)+'</b><div class="sub">'+data(p.data)+' · '+(p.arquivos||[]).length+' arquivo(s)'+(total?' · '+tam(total):'')+(p.atualizadoEm&&p.atualizadoEm.slice(0,10)!==String(p.data).slice(0,10)?' · atualizada em '+data(p.atualizadoEm):'')+'</div></div>'+(p.pastaLink?'<a class="btn '+(p.tipo==="final"?"verde":"pri")+' peq" href="'+esc(p.pastaLink)+'" target="_blank" rel="noopener" title="Abre a pasta no Google Drive; use “Fazer download” para baixar tudo de uma vez">⬇ Baixar tudo</a>':'')+'</div>';
    if(p.nota)ce+='<div class="nota">💬 '+esc(p.nota)+'</div>';
    ordem.forEach(function(g){
      if(g)ce+='<div class="grupo">'+esc(g)+'</div>';
      ce+='<div>';
      grupos[g].forEach(function(a){var e=extDe(a.nome);ce+='<div class="arq"><span class="ext" style="background:'+e[1]+';color:'+e[2]+'">'+e[0]+'</span><div class="n"><b title="'+esc(a.nome)+'">'+esc(a.nome)+'</b><span>'+tam(a.tamanho)+'</span></div><a class="btn peq" href="'+esc(a.ver)+'" target="_blank" rel="noopener">Ver</a><a class="btn peq pri" href="'+esc(a.baixar)+'" target="_blank" rel="noopener">Baixar</a></div>'});
      ce+='</div>';
    });
    ce+='</div>';
  });
  h+=sec("entregas","📦","Entregas do projeto",'<p class="sub" style="margin:-6px 0 12px">Todos os arquivos do seu projeto num só lugar: visualize no navegador ou baixe para o seu computador.</p>'+ce);
  secoes.push(["entregas","Entregas"]);

  // ── Modelos 3D
  var mods=d.modelos3d||[];
  if(mods.length){
    var cm='<p class="sub" style="margin:-6px 0 12px">Abra no navegador para girar, aproximar e conferir cada elemento — funciona também no celular.</p><div class="lista">';
    if(d.modelosJuntos)cm+='<a class="mod" href="'+esc(d.modelosJuntos)+'" target="_blank" rel="noopener" style="border-color:#bcd3f5;background:#f2f7fe"><span class="ic">🧩</span><span style="flex:1"><b style="color:#0a2557;font-size:14.5px">Todos os modelos sobrepostos</b><br><span class="sub">'+mods.length+' disciplinas juntas, com liga/desliga de cada uma</span></span><span class="btn pri peq">Abrir</span></a>';
    mods.forEach(function(m){cm+='<a class="mod" href="'+esc(m.link)+'" target="_blank" rel="noopener"><span class="ic">🧊</span><span style="flex:1;min-width:0"><b style="color:#0a2557;font-size:14.5px">'+esc(m.nome)+'</b><br><span class="sub">'+esc([m.disciplina,m.versao&&("versão "+m.versao),m.data&&data(m.data)].filter(Boolean).join(" · "))+'</span></span><span class="btn peq">Abrir</span></a>'});
    cm+='</div>';
    h+=sec("modelos","🧊","Modelos 3D (BIM)",cm);
    secoes.push(["modelos","Modelos 3D"]);
  }

  // ── Andamento: disciplinas + linha do tempo
  var ca='';
  if(discs.length){
    ca+='<div class="lista" style="margin-bottom:16px">';
    discs.forEach(function(x){ca+='<div class="disc"><b>'+esc(x.nome)+'</b>'+(x.situacao==="entregue"?'<span class="tag t-ok">✓ Entregue'+(x.entregue?' em '+data(x.entregue):'')+'</span>':x.situacao==="pausada"?'<span class="tag t-pau">Pausada</span>':'<span class="tag t-and">Em desenvolvimento</span>')+'</div>'});
    ca+='</div>';
  }
  var atus=d.atualizacoes||[];
  if(atus.length){
    ca+='<div class="tl">';
    atus.slice(0,40).forEach(function(a){ca+='<div class="tl-i"><div class="tl-e"><div class="tl-ic">'+esc(a.icone||"📝")+'</div><div class="tl-l"></div></div><div class="tl-c"><b>'+esc(a.titulo||"Atualização")+'</b>'+(a.descricao?'<p>'+esc(a.descricao)+'</p>':'')+'<small>'+esc([a.autor,quando(a.data)].filter(Boolean).join(" · "))+'</small></div></div>'});
    ca+='</div>';
    if(atus.length>40)ca+='<p class="sub">Mostrando as 40 atualizações mais recentes.</p>';
  } else ca+='<div class="vazio">As novidades do projeto aparecem aqui conforme a equipe avança.</div>';
  var equipe=[d.responsavel,d.coresponsavel,d.coresponsavel2,d.coresponsavel3].filter(Boolean);
  h+=sec("andamento","📈","Acompanhamento do projeto",ca,equipe.length?'<span class="sub">Equipe: <b style="color:#0f1f3d">'+esc(equipe.join(", "))+'</b></span>':'');
  secoes.push(["andamento","Andamento"]);

  document.getElementById("app").innerHTML=h;
  var nav=document.getElementById("nav"),ni=document.getElementById("navIn");
  ni.innerHTML=secoes.map(function(s,i){return '<a href="#'+s[0]+'"'+(i===0?' class="on"':'')+'>'+s[1]+'</a>'}).join("");
  nav.hidden=false;
  requestAnimationFrame(function(){requestAnimationFrame(function(){var b=document.getElementById("barra");if(b)b.style.width=prog+"%"})});
  // destaca a seção visível
  var links=[].slice.call(ni.querySelectorAll("a"));
  if("IntersectionObserver" in window){
    var obs=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(l){l.classList.toggle("on",l.getAttribute("href")==="#"+e.target.id)})}})},{rootMargin:"-40% 0px -55% 0px"});
    secoes.forEach(function(s){var el=document.getElementById(s[0]);if(el)obs.observe(el)});
  }
}

var token=(function(){var p=location.pathname.split("/"),i=p.indexOf("cliente");return(i>=0&&p[i+1])||new URLSearchParams(location.search).get("token")||""})();
async function carregar(primeira){
  if(!token){erro("O endereço está incompleto. Confira se o link foi copiado por inteiro.");return}
  try{
    var r=await fetch("/api/cliente?token="+encodeURIComponent(token)),d=await r.json();
    if(!r.ok){if(primeira)erro(d.error);return}
    var y=window.scrollY;render(d);if(!primeira)window.scrollTo(0,y);
  }catch(e){if(primeira)erro("Não foi possível carregar os dados do projeto. Verifique a sua internet e tente de novo.")}
}
carregar(true);
setInterval(function(){if(!document.hidden)carregar(false)},3*60*1000);
</script>
