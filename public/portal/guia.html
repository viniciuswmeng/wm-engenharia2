<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guia do Portal do Cliente — WM Engenharia</title>
<style>
@page{size:A4;margin:14mm 14mm 16mm}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#334155;background:#f3f6fb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.folha{max-width:820px;margin:0 auto;background:#fff;padding:28px 34px}
@media print{body{background:#fff}.folha{max-width:none;padding:0}}
.capa{background:linear-gradient(135deg,#0a2557,#1565d8);color:#fff;border-radius:14px;padding:26px 28px 24px;margin-bottom:14px}
.capa .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.capa img{height:34px}
.capa .k{font-size:10.5px;letter-spacing:2.5px;font-weight:700;opacity:.85}
.capa h1{margin:0 0 8px;font-size:27px;line-height:1.15}
.capa p{margin:0;font-size:14px;line-height:1.55;opacity:.92;max-width:560px}
.aviso{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:8px}
h2{display:flex;align-items:baseline;gap:10px;color:#0a2557;font-size:19px;margin:26px 0 10px;break-after:avoid}
h2 .n{font-size:12px;font-weight:800;color:#1565d8}
h2 .novo{font-size:10px;font-weight:800;color:#fff;background:#16a34a;border-radius:5px;padding:2px 6px;letter-spacing:.4px}
.g-corpo{font-size:13.5px;line-height:1.6}
.g-corpo p{margin:0 0 9px}.g-corpo h4{margin:14px 0 6px;color:#0a2557;font-size:14px;break-after:avoid}
.g-passos,.g-lista{margin:0 0 10px;padding-left:22px}.g-passos li,.g-lista li{margin-bottom:5px}
.g-fig{margin:6px auto 12px;break-inside:avoid;max-width:84%}.g-fig img{width:100%;display:block;border-radius:9px;border:1px solid #e6ecf4}
.g-par{display:grid;grid-template-columns:1fr 1fr;gap:12px;break-inside:avoid}.g-par .g-fig{max-width:none;margin:6px 0 12px}
.g-fig figcaption{font-size:11.5px;color:#6b7a90;margin-top:4px}
.g-cel{max-width:210px}
.g-lado{display:grid;grid-template-columns:1fr 210px;gap:20px;align-items:start}
.g-bt{display:inline-block;background:#1565d8;color:#fff;border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;white-space:nowrap}
.g-tag{display:inline-block;border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:700;white-space:nowrap}
.g-azul{background:#e7effb;color:#1a55b0}.g-verde{background:#dcfce7;color:#15803d}.g-amarelo{background:#fef3c7;color:#92400e}
.g-dica{background:#eef4fd;border:1px solid #d6e4f8;border-radius:9px;padding:9px 12px;font-size:13px;margin:4px 0 8px;break-inside:avoid}
.g-tab{width:100%;border-collapse:collapse;font-size:12.5px;margin:0 0 12px;break-inside:avoid}
.g-tab th{text-align:left;background:#f3f6fb;color:#0a2557;padding:6px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.g-tab td{padding:6px 9px;border-top:1px solid #e6ecf4;vertical-align:top}
.g-faq details{border:1px solid #e6ecf4;border-radius:9px;padding:9px 12px;margin-bottom:7px;break-inside:avoid}
.g-faq summary{font-weight:700;color:#0a2557;list-style:none}.g-faq summary::-webkit-details-marker{display:none}.g-faq p{margin:4px 0 0}
.contato{display:flex;gap:28px;align-items:center;background:#0a2557;color:#fff;border-radius:12px;padding:16px 22px;margin-top:22px;break-inside:avoid}
.contato img{height:30px}.contato .k{font-size:10px;letter-spacing:2px;opacity:.75;font-weight:700}.contato b{display:block;font-size:13.5px;margin-top:2px}
.sec{break-before:auto}
.sec.nova-folha{break-before:page}
</style>
</head>
<body>
<div class="folha" id="guia"></div>
<script src="/portal/guia.js"></script>
<script>
(function(){
  var G=window.WM_GUIA,c=G.contato;
  // seções que começam numa folha nova no PDF (as mais longas)
  var NOVA={interiores:1,visualizador:1};
  var h='<div class="capa"><div class="top"><img src="/Logo_Branco.png" alt="WM Engenharia"><span class="k">PORTAL DO CLIENTE</span></div><h1>'+G.titulo+'</h1><p>'+G.intro+'</p></div>';
  h+='<div class="aviso">ⓘ '+G.aviso+'</div>';
  G.secoes.forEach(function(s,i){
    h+='<section class="sec'+(NOVA[s.id]?' nova-folha':'')+'"><h2><span class="n">'+String(i+1).padStart(2,"0")+'</span>'+s.titulo+(s.novo?' <span class="novo">NOVO</span>':'')+'</h2><div class="g-corpo">'+s.html.replace(/<details>/g,"<details open>")+'</div></section>';
  });
  h+='<div class="contato"><img src="/Logo_Branco.png" alt=""><div><span class="k">E-MAIL</span><b>'+c.email+'</b></div><div><span class="k">WHATSAPP</span><b>'+c.whatsapp+'</b></div><div><span class="k">INSTAGRAM</span><b>'+c.instagram+'</b></div></div>';
  document.getElementById("guia").innerHTML=h;
  [].forEach.call(document.querySelectorAll("img"),function(i){i.loading="eager"});
  // duas figuras seguidas ficam lado a lado (economiza folhas)
  [].forEach.call(document.querySelectorAll(".g-fig + .g-fig"),function(f){var a=f.previousElementSibling;if(a.parentNode.classList.contains("g-par"))return;var w=document.createElement("div");w.className="g-par";a.parentNode.insertBefore(w,a);w.appendChild(a);w.appendChild(f)});
})();
</script>
</body>
</html>
